name: Build Yu-Gi-Oh! Calc GBA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-gba:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile .gba ROM
        run: make

      - name: Upload .gba artifact
        uses: actions/upload-artifact@v4
        with:
          name: ygo_calc_gba
          path: ygo_calc.gba
